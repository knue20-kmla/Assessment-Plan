<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교수학습평가계획서</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
*{box-sizing:border-box}
:root{--bg:#f7f0e8;--ink:#293440;--muted:#7a6f66;--line:rgba(97,67,48,.16);--line2:rgba(97,67,48,.28);--accent:#151c26;--accent-d:#2a3442;--soft:#f3e8dc;--focus:#d9633f;--hh:68px}
html{background:var(--bg)}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;color:#000;font-size:9pt}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:var(--hh);padding:8px clamp(14px,2.4vw,32px);background:#fffefc;border-bottom:1px solid var(--line);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:14px;color:var(--ink)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:contain;flex:none}
.brand .school{margin:0 0 1px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.brand h1{margin:0;font-size:22px;font-weight:800;color:var(--ink);line-height:1.2;white-space:nowrap}
.tb-doc{display:flex;align-items:center;gap:8px;background:#faf5ee;border:1px solid var(--line);border-radius:10px;padding:3px 10px 3px 12px}
.tb-doc .dlabel{font-size:11px;font-weight:800;color:var(--muted)}
.tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.seg button{min-height:34px;border:0;border-radius:7px;padding:0 16px;color:var(--muted);background:transparent;cursor:pointer;font:inherit;font-weight:600}
.seg button.on{color:var(--ink);background:#fff;box-shadow:0 4px 14px rgba(71,48,32,.14)}
.topbar .ghost,.topbar .primary{min-height:38px;padding:0 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line2);background:#fffefc;color:var(--ink)}
.topbar .ghost:hover{background:var(--soft)}
.topbar .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.topbar .primary:hover{background:var(--accent-d)}
.layout{display:flex;align-items:flex-start;padding:0}
#toc{position:sticky;top:var(--hh);width:216px;flex:none;height:calc(100vh - var(--hh));overflow:auto;padding:22px 12px;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:13px;color:#fff;background:radial-gradient(220px 180px at 50% 0%,rgba(255,255,255,.07),rgba(0,0,0,0) 65%),radial-gradient(500px 600px at 50% 92%,rgba(233,120,84,.38),rgba(0,0,0,0) 60%),linear-gradient(#1c2536 0%,#10151e 100%)}
#toc p{margin:0 10px 12px;color:rgba(255,255,255,.55);font-size:11px;font-weight:800;letter-spacing:.08em}
#toc a{display:block;padding:9px 12px;margin-bottom:3px;border-radius:9px;color:rgba(255,255,255,.78);cursor:pointer;line-height:1.4;font-weight:600;border:1px solid transparent}
#toc a:hover{background:rgba(255,255,255,.08);color:#fff}
#toc a.on{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);color:#fff}
.main{min-width:0;flex:none;width:210mm;margin:28px auto 80px}
.sumstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--line);margin-bottom:14px;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
.sumstrip div{padding:12px 14px;background:#fff}
.sumstrip b{display:block;font-size:22px;font-weight:800;line-height:1.1;color:var(--ink)}
.sumstrip span.l{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:700}
.sec,.h{scroll-margin-top:84px}
@media(max-width:1040px){#toc{display:none}.brand h1{font-size:18px}.main{margin:16px auto 60px}}
.sheet{width:210mm;margin:0;background:#fff;padding:30pt 20mm 60pt;border:1px solid var(--line);border-radius:4px;box-shadow:0 10px 30px rgba(71,48,32,.1),0 2px 6px rgba(71,48,32,.06);position:relative}
.hdr{text-align:center;color:#f00;font-weight:bold;font-style:italic;font-size:8.5pt;margin-bottom:26pt}
table{border-collapse:collapse}
.red{color:#f00}.b{font-weight:bold}.u{text-decoration:underline}
button.ctl{font:inherit;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:11px;padding:2px 9px;border:1px solid rgba(97,67,48,.28);background:#fff;border-radius:6px;color:#293440;cursor:pointer;margin:1px}
button.ctl:hover{border-color:var(--line2);background:var(--soft)}
input[type=text]{border:0;background:transparent;font:inherit;line-height:1.15;height:1.2em;width:100%;padding:0;outline:0;color:inherit;display:block;min-width:0}
input[type=text]:hover,.ls:hover,.it .tx:hover{background:#fbf5ef}
input[type=text]:focus,.ls:focus{background:#fdf1e8;box-shadow:inset 0 0 0 1px var(--focus)}
.ls{outline:0;cursor:text;min-height:1.2em;word-break:break-all;white-space:pre-wrap}
.ls>div{min-height:1.2em}
.ls.m1>div,.ls.m2>div{position:relative;padding-left:8pt}
.ls.m1>div:before,.ls.m2>div:before{content:"■";position:absolute;left:0;top:0;font-size:6pt;line-height:inherit}
.ls.m2>div:before{content:"▪";font-size:9pt}
.ls.hang>div{padding-left:14pt;text-indent:-14pt}
.ph>div:only-child:has(>br:only-child):before,.ph>div:only-child:empty:before{content:attr(data-ph);color:#f00;font-weight:bold;pointer-events:none}
.cb{display:inline-flex;align-items:center;gap:2pt;white-space:nowrap;cursor:pointer}
.cb input[type=checkbox]{appearance:none;-webkit-appearance:none;width:7pt;height:7pt;border:.8pt solid #000;margin:0;background:transparent;flex:none}
.cb input[type=checkbox]:checked{background:#000}
.sec{display:flex;align-items:flex-end;height:25.6pt;margin-top:28pt;break-after:avoid}
.sec .n{width:28pt;height:25.6pt;font-size:15pt;text-align:center;line-height:25.6pt}
.sec .t{font-size:14pt;font-weight:bold;letter-spacing:.6pt;height:24pt;line-height:24pt;padding:0 6pt 0 7pt;border-bottom:2pt solid #000;flex:none}
.h{font-size:14.5pt;font-weight:bold;letter-spacing:.7pt;line-height:20pt;margin-top:22pt;break-after:avoid}
.p{padding-left:19.4pt;text-indent:-19.4pt;text-align:justify;font-size:10.5pt;line-height:17.5pt;margin:0 -4pt 0 5pt;letter-spacing:.05pt;word-break:keep-all}
.p.s2{padding-left:41.5pt;text-indent:-23pt}
.note{font-size:11pt;line-height:15pt}
.blk{position:relative;break-inside:avoid}
.blk .x{position:absolute;right:2pt;top:-1pt;z-index:2}
.pt{width:100%;table-layout:fixed;border-top:1.5pt solid #000}
.pt td{border:.5pt solid #000;padding:0;text-align:center;font-size:10pt;vertical-align:middle}
.pt .hd td{height:25.6pt;font-weight:bold;line-height:11.5pt}
.pt .dr td{font-size:9.5pt;line-height:10.5pt}
.pt td.u{text-align:left;padding:2pt 3pt;font-size:9pt;line-height:12pt}
.hs{display:flex;align-items:center;justify-content:center}
.hs input{width:20pt;text-align:right}
.m .lab{padding:3pt 0 2pt 7pt;font-size:9pt;text-decoration:underline;line-height:12pt}
.m .bx{margin:0 4pt 0 6pt;border:.8pt dashed #000}
.m .r{display:grid;grid-template-columns:108.7pt 1fr;border-bottom:.8pt dashed #000;font-size:9pt}
.m .r:last-child{border-bottom:0}
.m .r>div{padding:2pt 0}
.m .r .k{display:flex;align-items:center;justify-content:center;border-right:.8pt dashed #000}
.m .r .v{padding-left:5pt}
.g{display:grid;grid-template-columns:88pt 90pt 91pt 1fr;width:100%}
.g>*{height:12pt;display:flex;align-items:center}
.sep{height:5pt;position:relative}
.sep:before,.sep:after{content:"";position:absolute;left:0;right:0;border-top:1.5pt solid #000}
.sep:before{top:.5pt}.sep:after{bottom:0}
.addrow{margin:4pt 0}
.rt{width:100%;table-layout:fixed;border-top:1.5pt solid #000;border-bottom:1.5pt solid #000}
.rt td{border:.5pt solid #000;text-align:center;padding:0;font-size:8pt;line-height:11pt}.rt tr:nth-child(4) td{white-space:nowrap}
.rt td.lb{font-weight:bold;font-size:9.5pt;line-height:12pt}
.rt td.dl{border-left:1.5pt solid #000}
.rt input[type=text]{text-align:center}
.pc{display:flex;align-items:center;justify-content:center;gap:1pt}
.sc{display:flex;flex-direction:column;align-items:center;line-height:11pt;padding:1pt 0}
.sc>div{display:flex;align-items:center;justify-content:center}
.sc input{width:22pt;text-align:right}
.rt .nm .ls{text-align:center;padding:1pt}
.tg{display:flex;align-items:center;justify-content:center;gap:2pt}
.warn{color:#b3261e;font-size:12px;margin-top:4px;background:#fdf0ef;border-radius:6px;padding:3px 9px;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;display:inline-block}
.warn:empty{display:none}
.hin{font:inherit;color:inherit;letter-spacing:inherit;line-height:inherit;height:auto;width:100%;text-align:inherit}
@supports (field-sizing:content){.hin{field-sizing:content;width:auto;min-width:3em;max-width:100%}}
.hdr .hin{text-align:center;width:100%;field-sizing:fixed;font-weight:bold;font-style:italic;color:#f00}
.sec .t .hin{font-weight:bold}
.tl{display:flex;justify-content:center;align-items:baseline;white-space:pre;text-align:center}
.tl .hin{text-align:center}
.it0{width:100%;table-layout:fixed;border-top:1.5pt solid #000;border-bottom:2pt solid #000;margin-bottom:4pt}
.it0 td{border:.5pt solid #000;text-align:center;padding:0}
.it0 tr.ih td{height:18pt;font-weight:bold;font-size:12.5pt;border-top:0}
.it0 tr.iv td{height:19pt}
.it0 td:first-child{border-left:0}.it0 td:last-child{border-right:0}
.sec .sub{font-size:14pt;line-height:22pt;letter-spacing:.3pt;margin-left:2pt}
.sec .sub .hin{font-weight:normal}
.gr{width:100%;border:.8pt dashed #000;display:grid;grid-template-columns:1fr 1fr;font-size:9pt;line-height:12pt}
.gr>div{padding:3pt 4pt 4pt 6pt;border-right:.8pt dashed #000;border-bottom:.8pt dashed #000;min-width:0}
.gr>div:nth-child(2n){border-right:0}
.gr>div.last{border-bottom:0}
.gt{border-collapse:collapse;font-size:11pt;line-height:15.5pt;width:100%;border-bottom:1.5pt solid #000;border-top:1.5pt solid #000;margin-top:5pt}
.gt td{text-align:center;border-bottom:.5pt solid #000;padding:0;height:16.5pt;width:50%}
.gt td:first-child{border-right:.5pt solid #000}
.gt tr:first-child td{border-bottom:1.5pt solid #000}
.gt tr:last-child td{border-bottom:0}
.s5{width:100%;border-collapse:collapse;border-top:1.5pt solid #000}
.s5 td{padding:2pt 4pt;border:.5pt solid #000;text-align:center;font-size:9pt;line-height:12pt;vertical-align:middle}
.s5 td.t{text-align:left}
.s5 tr{break-inside:avoid}
.mb{border-bottom:1.5pt solid #000;font-size:9.5pt;line-height:15.6pt;padding:2pt 4pt 3pt 8pt}
.mb .ttl{text-align:center;font-weight:bold;font-size:12pt;line-height:23pt;border-bottom:1.5pt solid #000;margin:0 -4pt 3pt -8pt}
.mb .i{margin-left:4pt;padding-left:11pt;text-indent:-7pt}
.rp{width:100%;table-layout:fixed;border:.8pt solid #000;margin:3pt 0 4pt}
.rp td:first-child{text-align:center}
.rp td{border:.5pt solid #000;padding:0 2pt;font-size:10pt;line-height:12pt;height:12.9pt}
.pf{width:100%;table-layout:fixed;border-top:1.5pt solid #000;border-bottom:1.5pt solid #000;margin-top:4pt}
.pf td{border:.5pt solid #000;padding:0 2pt;font-size:9pt;line-height:12pt;vertical-align:middle}
.pf td.lbl{text-align:center;font-size:9.5pt}
.pf .ck{display:grid;align-items:center;padding-left:3pt;height:12pt}
.pf td.dsh{border-bottom:.6pt dashed #000;padding:1pt 2pt}
.ab{display:flex;gap:2pt;align-items:flex-start;border-bottom:.5pt solid #000;margin:0 -2pt}
.ab:last-of-type{border-bottom:0}
.ab .gl{width:20pt;flex:none;border-right:.5pt solid #000}
.ab .gl input{text-align:center;color:#f00}
.ab .ls{flex:1}
.tt{font-size:9pt;margin:2pt 0 6pt;text-align:right}

.blkbar{text-align:right;margin-bottom:1pt}
.it{display:flex;position:relative}
.it .lab{flex:none;width:19.4pt}
.it.lv1{margin-left:23pt}.it.lv1 .lab{width:19pt}
.it .tx{flex:1;outline:0;min-width:0;min-height:1.2em;word-break:keep-all}
.it .tx:focus{background:#fdf1e8;box-shadow:inset 0 0 0 1px var(--focus)}
.it .ctls{position:absolute;right:-6pt;top:-11pt;display:none;background:#fff;z-index:3}
.it:hover .ctls,.it:focus-within .ctls{display:flex}
.it.p{padding-left:0;text-indent:0;margin:0 -4pt 0 5pt}
.it.raw .lab{display:none}
.it.raw.i{margin-left:4pt;padding-left:11pt;text-indent:-7pt}
.it.raw .tx{text-indent:inherit}
.mb .it.raw{font-size:9.5pt;line-height:15.6pt}
.note .it.raw{font-size:11pt;line-height:15pt;text-align:justify;margin:0}
body.pv .noprint,body.pv button.ctl,body.pv .warn{display:none!important}
body.pv .ph>div:only-child:has(>br:only-child):before{content:""}
body.pv .ls.m1>div:has(>br:only-child):before,body.pv .ls.m2>div:has(>br:only-child):before{content:""}
.pgl{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed #8a948f;pointer-events:none;z-index:5}
.pgl span{position:absolute;right:8px;top:-9px;background:#fff;color:#8a948f;padding:0 6px;font:11px "Segoe UI","Malgun Gothic",sans-serif}
body.pm .noprint,body.pm button.ctl,body.pm .warn,body.pm .hdr,body.pm .it .ctls{display:none!important}
body.pm .ph>div:only-child:has(>br:only-child):before{content:""}
body.pm .ls.m1>div:has(>br:only-child):before,body.pm .ls.m2>div:has(>br:only-child):before{content:""}
input.docname{font:inherit;font-size:16px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 8px;margin-left:0;width:min(280px,36vw);height:auto;color:var(--ink);line-height:1.3}
input.docname:hover{border-color:rgba(97,67,48,.28);background:#fff}
input.docname:focus{border-color:var(--accent);background:#fff;box-shadow:none}
.docline{display:flex;align-items:center;gap:8px}
.saved{font-size:12px;color:var(--muted);white-space:nowrap;transition:color .2s}
.saved.flash{color:var(--accent);font-weight:700}
.modal{position:fixed;inset:0;z-index:50;background:rgba(21,28,38,.5);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
.modal[hidden]{display:none}
.mbox{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 60px rgba(41,28,20,.28);width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--soft)}
.mh b{font-size:17px}.mh span{color:var(--muted);font-size:12px;flex:1}
.mbox button{font:inherit;font-size:13px;min-height:34px;padding:0 12px;border-radius:7px;border:1px solid rgba(97,67,48,.28);background:#fff;color:#293440;cursor:pointer}
.mbox button:hover{border-color:var(--line2);background:var(--soft)}
.mbox button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.mbox button.pri:hover{background:var(--accent-d);color:#fff}
.mbox button.dng:hover{border-color:#9e2f38;color:#9e2f38}
.mtools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line)}
#dl{overflow:auto;padding:10px 12px 16px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.drow.cur{border-color:var(--accent);background:#fbf6f0}
.dinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.dinfo b{font-size:15px;word-break:break-all}
.dinfo em{font-style:normal;font-size:11px;font-weight:800;color:var(--accent)}
.dinfo span{font-size:12px;color:var(--muted)}
.dacts{display:flex;gap:6px;flex-wrap:wrap}
@media print{#dm,#bar{display:none!important}}
.gdbox .mtools{border-bottom:0}
.gdh{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fbf7f2;border-bottom:1px solid var(--line)}
.gdh b{font-size:14px}.gdh span{font-size:12px;color:var(--muted)}
.gauto{display:flex;align-items:center;gap:6px;font-size:13px;color:#293440}
.gauto input{width:15px;height:15px}
.gmsg{margin:6px 20px;font-size:13px;color:var(--muted)}
#gl{padding:0 12px 8px}
.xmenu{position:relative}
.xpop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:240px;background:#fffefc;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(71,48,32,.18);padding:6px}
.xpop[hidden]{display:none}
.xpop button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;background:transparent;border-radius:8px;padding:9px 12px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.xpop button:hover{background:var(--soft)}
.xpop button b{font-size:14px}.xpop button span{font-size:11.5px;color:var(--muted)}
.xtoast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#151c26;color:#fff;padding:11px 18px;border-radius:10px;font:14px Pretendard,'Malgun Gothic',sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.28);transition:.25s;z-index:60;max-width:90vw}
.xtoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media print{.xtoast,.xmenu{display:none!important}}
@media print{
 .pgl{display:none}
 .layout{display:block;padding:0}.main{zoom:1!important;width:auto}#toc,.sumstrip{display:none}
 .ph>div:only-child:has(>br:only-child):before{content:""}
 .ls.m1>div:has(>br:only-child):before,.ls.m2>div:has(>br:only-child):before{content:""}
 .it .tx:focus{background:none}
 html{background:#fff}#bar,.noprint,button.ctl{display:none!important}
 .sheet{box-shadow:none;margin:0;padding:0;width:auto}
 .hdr{display:none}
 input[type=text]:focus,.ls:focus{background:none;box-shadow:none}
 .warn{display:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 tr,.blk,.gr>div{break-inside:avoid}
}
@page{size:A4;margin:24mm 20mm 20mm;
 @top-center{content:"▣ 2026학년도 1,2학년용 양식(학업성적관리지침 변경 사항 반영) ▣";color:#f00;font-weight:bold;font-style:italic;font-size:8.5pt}
 @bottom-center{content:"- " counter(page) " -";font-size:9.5pt}}
</style>
</head>
<body>
<header id="bar" class="topbar"><div class="brand"><img src="logo.png" alt="민족사관고등학교"><div><p class="school">민족사관고등학교</p><h1>교수학습평가계획서</h1></div></div>

function balance(ed){const cols=S.pcols,n=cols.length;if(!n)return;

 if(ed==null){const b=Math.floor(100/n);cols.forEach((c,i)=>V['c'+c+'.pt']=String(i===n-1?100-b*(n-1):b));return}

 const others=cols.filter(c=>c!==ed),rest=100-e,osum=others.reduce((a,c)=>a+num(V['c'+c+'.pt']),0);let acc=0;
 others.forEach((c,i)=>{let v;if(i===others.length-1)v=Math.max(0,rest-acc);else{v=osum>0?Math.round(num(V['c'+c+'.pt'])/osum*rest):Math.round(rest/others.length);acc+=v}V['c'+c+'.pt']=String(v)})}

 if(!sum){balance(null);return}let acc=0;cols.forEach((c,i)=>{let v;if(i===n-1)v=100-acc;else{v=Math.round(num(V['c'+c+'.pt'])/sum*100);acc+=v}V['c'+c+'.pt']=String(v)})}

 const body={format:'assessment-plan',version:1,name:rec.name,updated:rec.updated,data:rec.data};
 const bnd='ap'+Math.random().toString(36).slice(2);
 const mk=m=>'--'+bnd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(m)+'\r\n--'+bnd+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(body)+'\r\n--'+bnd+'--';
 const fname=rec.name.replace(/[\\/:*?"<>|]/g,'_')+'.json';
 const upd=!!rec.driveId;
 const url='https://www.googleapis.com/upload/drive/v3/files'+(upd?'/'+rec.driveId:'')+'?uploadType=multipart&fields=id,modifiedTime';
 let r;try{r=await gApi(url,{method:upd?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bnd},body:mk(upd?{name:fname}:{name:fname,mimeType:'application/json',parents:[folder]})},silent)}
 catch(e){if(upd&&/Drive 404/.test(e.message)){rec.driveId=null;return gSave(rec,silent)}throw e}
 const j=await r.json();rec.driveId=j.id;rec.driveSynced=Date.now();persist();return j}
async function gList(){const folder=await gFolderId();
 const q=encodeURIComponent("'"+folder+"' in parents and trashed=false");
 const j=await(await gApi('https://www.googleapis.com/drive/v3/files?q='+q+'&orderBy='+encodeURIComponent('modifiedTime desc')+'&pageSize=100&fields=files(id,name,modifiedTime)')).json();return j.files||[]}
async function gGet(id){return(await gApi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media')).json()}
async function gDel(id){await gApi('https://www.googleapis.com/drive/v3/files/'+id,{method:'DELETE'})}
const hhmm=()=>new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
async function gSaveCur(){save();gStat('저장 중…');
 try{await gSave(curRec,false);gStat('드라이브에 저장됨 '+hhmm());gChip('☁ 드라이브 저장됨 '+hhmm());renderDocs()}
 catch(e){if(e.message!=='noclient'){gStat('저장 실패: '+e.message);gChip('☁ 저장 실패')}}}
function gSched(){if(!gAutoOn()||!curRec.driveId&&!gOK())return;clearTimeout(gTimer);gTimer=setTimeout(async()=>{
 if(gBusy)return;if(!gOK()){gChip('☁ 재연결 필요 (저장 버튼)');return}
 gBusy=true;gChip('☁ 저장 중…');try{await gSave(curRec,true);gChip('☁ 드라이브 저장됨 '+hhmm())}catch(e){gChip('☁ 재연결 필요 (저장 버튼)')}gBusy=false},4000)}
async function gOpenList(){const box=document.getElementById('gl');box.innerHTML='<p class="gmsg">드라이브 목록을 불러오는 중…</p>';
 try{const files=await gList();box.innerHTML='';if(!files.length){box.innerHTML='<p class="gmsg">드라이브에 저장된 문서가 없습니다.</p>';return}
  files.forEach(f=>{const row=document.createElement('div');row.className='drow';
   const info=document.createElement('div');info.className='dinfo';const b=document.createElement('b');b.textContent=f.name.replace(/\.json$/i,'');const sp=document.createElement('span');sp.textContent='드라이브 수정 '+fmtDate(f.modifiedTime);info.appendChild(b);info.appendChild(sp);
   const acts=document.createElement('div');acts.className='dacts';
   [['불러오기',()=>gPull(f),'pri'],['드라이브에서 삭제',async()=>{if(!confirm('드라이브의 "'+b.textContent+'" 파일을 삭제할까요?'))return;try{await gDel(f.id);DB.list.forEach(d=>{if(d.driveId===f.id)d.driveId=null});persist();gOpenList();renderDocs()}catch(e){alert('삭제 실패: '+e.message)}},'dng']].forEach(([t,fn,c])=>{const bt=document.createElement('button');bt.textContent=t;if(c)bt.className=c;bt.onclick=fn;acts.appendChild(bt)});
   row.appendChild(info);row.appendChild(acts);box.appendChild(row)})}
 catch(e){box.innerHTML='';if(e.message!=='noclient'){const p=document.createElement('p');p.className='gmsg';p.textContent='불러오기 실패: '+e.message;box.appendChild(p)}}}
async function gPull(f){try{const o=await gGet(f.id);if(!o||!o.data||!o.data.vals)throw new Error('올바른 문서 파일이 아닙니다.');
 const local=DB.list.find(d=>d.driveId===f.id);
 if(local){if(!confirm('이 기기에 같은 문서("'+local.name+'")가 있습니다. 드라이브 내용으로 덮어쓸까요?'))return;local.data=o.data;local.name=o.name||local.name;local.updated=Date.now();local.driveSynced=Date.now();persist();openDoc(local.id)}
 else{const r={id:uidDoc(),name:o.name||f.name.replace(/\.json$/i,''),updated:Date.now(),data:o.data,driveId:f.id,driveSynced:Date.now()};DB.list.unshift(r);persist();openDoc(r.id)}
 closeDocs()}catch(e){alert('불러오기 실패: '+e.message)}}
function gSettings(){const cur=gcid();const v=prompt('Google OAuth 클라이언트 ID를 붙여넣으세요.\n(발급 방법은 저장소의 GOOGLE-DRIVE-SETUP.md 참고)\n비워 두면 연결을 끕니다.',cur);if(v===null)return;
 localStorage.setItem('plan2026-gcid',v.trim());gClient=null;gTok=null;gStat(v.trim()?'클라이언트 ID 저장됨 · [Google 계정 연결]을 누르세요':'연결 설정 없음')}
async function gConnectBtn(){try{await gConnect();gStat('연결됨')}catch(e){if(e.message!=='noclient')gStat('연결 실패: '+e.message)}}
function gAutoToggle(on){localStorage.setItem('plan2026-gauto',on?'1':'0');if(on)gSched()}
(function(){const a=document.getElementById('gauto');if(a)a.checked=gAutoOn();gStat(gcid()?'연결 안 됨 · [Google 계정 연결]을 누르세요':'연결 설정이 필요합니다 · [연결 설정]')})();

let pgT;function schedBreaks(){clearTimeout(pgT);pgT=setTimeout(drawBreaks,150)}
function drawBreaks(){
 doc.querySelectorAll('.pgl').forEach(e=>e.remove());
 const main=document.getElementById('main');const z=parseFloat(main.style.zoom)||1;
 const units=[...doc.querySelectorAll('.tl,.sec,.h,.blk,.note,.it,tr,.gr>div,.m,.mb')];
 const pos=()=>{const sr=doc.getBoundingClientRect();return units.map(e=>{const r=e.getBoundingClientRect();return{t:(r.top-sr.top)/z,b:(r.bottom-sr.top)/z}})};
 const edit=pos();
 const hadPm=document.body.classList.contains('pm');document.body.classList.add('pm');const pm=pos();if(!hadPm)document.body.classList.remove('pm');
 const ok=pm.map(p=>p.b-p.t>0.5);
 const PH=253*96/25.4;
 const ti=units.findIndex(e=>e.classList.contains('tl'));if(ti<0)return;
 const start=pm[ti].t;let end=0;pm.forEach((p,i)=>{if(ok[i]&&p.b>end)end=p.b});
 const AV='.blk,tr,.gr>div',HD='.sec,.h';
 const breaks=[];let B=start+PH,guard=0;
 while(B<end-2&&guard++<60){
  let bk=B,best=null;
  units.forEach((e,i)=>{if(ok[i]&&e.matches(AV)&&pm[i].t<B-1&&pm[i].b>B+1&&pm[i].b-pm[i].t<PH){if(best==null||pm[i].t<pm[best].t)best=i}});
  if(best!=null)bk=pm[best].t;
  else units.forEach((e,i)=>{if(ok[i]&&e.matches(HD)&&pm[i].b<=B+1&&pm[i].b>B-60){let j=-1;units.forEach((u,k)=>{if(ok[k]&&!u.matches(HD)&&pm[k].t>=pm[i].b-1&&(j<0||pm[k].t<pm[j].t))j=k});if(j>=0&&pm[j].t>=B-3)bk=Math.min(bk,pm[i].t)}});
  if(bk<=(breaks.length?breaks[breaks.length-1]:start)+40)bk=B;
  breaks.push(bk);B=bk+PH}
 window.__pg={start,breaks:breaks.slice(),end};
 breaks.forEach((bk,k)=>{let bi=-1;units.forEach((e,i)=>{if(ok[i]&&pm[i].t<=bk+0.5&&(bi<0||pm[i].t>=pm[bi].t))bi=i});
  const y=bi<0?bk:edit[bi].t+(bk-pm[bi].t);
  const d=document.createElement('div');d.className='pgl';d.style.top=y+'px';d.innerHTML='<span>'+(k+2)+'쪽 시작</span>';doc.appendChild(d)})}
['input','change','click'].forEach(ev=>doc.addEventListener(ev,schedBreaks));
window.addEventListener('resize',()=>{fit();schedBreaks()});window.addEventListener('load',schedBreaks);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedBreaks);
render();fit();schedBreaks();
</script>
<script src="export.js"></script>
</body>
